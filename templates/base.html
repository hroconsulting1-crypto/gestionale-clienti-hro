<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topnav">
    <div class="brand">HR&amp;O <span>Gestionale</span></div>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('clienti_list') }}">Clienti</a>
    <a href="{{ url_for('prospect_list') }}">Prospect</a>
    <a href="{{ url_for('fatturato_report') }}">Fatturato</a>
    <a href="{{ url_for('impostazioni') }}">Impostazioni</a>
    <a href="{{ url_for('cliente_nuovo') }}" class="btn-nav">+ Nuovo contatto</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
