name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Compila l'eseguibile
        run: pyinstaller gestionale.spec --noconfirm

      - name: Carica l'eseguibile come artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-clienti-exe
          path: dist/gestionale-clienti.exe
